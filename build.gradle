plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'attune project - backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// 테스트 DB: Testcontainers MySQL — src/test/resources/application.yml 의 jdbc:tc: URL로 컨테이너 자동 기동 (Docker 필요)
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testRuntimeOnly 'org.testcontainers:testcontainers-jdbc' // jdbc:tc: URL 지원 (ContainerDatabaseDriver)
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'io.sentry:sentry-spring-boot-4-starter:8.46.0'
	// Logback appender: @RestControllerAdvice가 예외를 resolve 하므로 SentryExceptionResolver
	// 경로로는 안 잡힌다. log.error(500대)를 Sentry 이벤트로 보내려면 이 의존성이 필요하다
	// (starter에 미포함). sentry.logging.enabled=true + minimum-event-level=error 와 함께 동작.
	implementation 'io.sentry:sentry-logback:8.46.0'
	implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
	implementation 'nl.martijndwars:web-push:5.1.2'
	implementation 'org.apache.httpcomponents:httpclient:4.5.13'
	implementation 'org.bouncycastle:bcprov-jdk18on:1.78'
	implementation 'org.bitbucket.b_c:jose4j:0.7.9'


	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'      // 1. API (필수)
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'       // 2. 구현체 (필수)
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'    // 3. JSON 처리 (필수)

	// 아키텍처 규칙 검증 (ArchUnit) — src/test/java/attune/architecture
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs '-Duser.timezone=Asia/Seoul'
}

tasks.named('bootRun') {
	jvmArgs '-Duser.timezone=Asia/Seoul'
}
