name: Attune Backend Prod Deploy

on:
  push:
    branches: [ "main" ] # main 브랜치에 푸시될 때 작동
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make application-secret.yml
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION_SECRET_YML }}" | base64 --decode > ./src/main/resources/application-secret.yml
        shell: bash

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: hannah098/attune-be:prod

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USERNAME }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 12m
          script: |
            set -eu

            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            docker stop attune-prod-apps || true
            docker rm attune-prod-apps || true
            docker image prune -f
            docker pull hannah098/attune-be:prod
            docker run -d --name attune-prod-apps --network host \
              --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e APP_MIGRATION_DEFAULTTAGS_ENABLED=false \
              hannah098/attune-be:prod

            for attempt in $(seq 1 120); do
              health_status="$(curl --silent --output /tmp/attune-prod-health.json \
                --write-out '%{http_code}' http://127.0.0.1:8081/actuator/health/readiness || true)"

              if [ "$health_status" = "200" ]; then
                cat /tmp/attune-prod-health.json
                echo
                echo "Prod application is healthy."
                exit 0
              fi

              if [ "$(docker inspect --format '{{.State.Running}}' attune-prod-apps 2>/dev/null || true)" != "true" ]; then
                echo "Prod application container exited before becoming healthy."
                docker inspect attune-prod-apps --format 'status={{.State.Status}} exitCode={{.State.ExitCode}} error={{.State.Error}}'
                docker logs --tail 300 attune-prod-apps
                exit 1
              fi

              if [ $((attempt % 12)) -eq 0 ]; then
                echo "Waiting for readiness: attempt=${attempt}/120, httpStatus=${health_status}"
                cat /tmp/attune-prod-health.json 2>/dev/null || true
                echo
                docker logs --tail 100 attune-prod-apps
              fi

              sleep 5
            done

            echo "Prod application did not become healthy within 600 seconds."
            docker inspect attune-prod-apps --format 'status={{.State.Status}} exitCode={{.State.ExitCode}} error={{.State.Error}}'
            docker logs --tail 300 attune-prod-apps
            exit 1
