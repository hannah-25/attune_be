name: CI

# PR 검증 게이트. 배포(deploy-dev/prod)와 분리된 품질 게이트다.
# develop 브랜치 push 는 deploy-dev 가 빌드하므로 여기서는 제외(중복 방지).
on:
  pull_request:
  push:
    branches-ignore:
      - develop
      - main

# 같은 ref 의 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test + architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 테스트 포함 빌드 (ArchUnit 아키텍처 규칙 포함). 시크릿 불필요:
      # 테스트는 src/test/resources/application.yml 의 스텁 값과 Testcontainers MySQL 로 동작한다.
      # (ubuntu-latest 러너는 Docker 기본 제공 — jdbc:tc: URL이 mysql:8.4 컨테이너를 자동 기동)
      - name: Build (test + ArchUnit)
        run: ./gradlew build

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

  docs-check:
    name: docs link + freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs
        run: bash scripts/agent/check-docs
