spring:
  application:
    name: attune

  profiles:
    default: local

  # application-secret.yml import
  config:
    import:
      - optional:classpath:application-secret.yml

  jpa:
    open-in-view: false # OSIV 비활성화 (성능/안정성 향상)
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true


# Springdoc OpenAPI (Swagger)
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    try-it-out-enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
    persist-authorization: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json



# Spring Boot Actuator ??
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
      base-path: /actuator
  metrics:
    export:
      simple:
        enabled: true
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    db:
      enabled: false
    diskspace:
      enabled: false




# 앱 공통 설정


# Logging 설정
logging:
  pattern:
    console: '%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
  level:
    attune.calendar: DEBUG

notification:
  push:
    # 기본값 stub: 키가 없어도 부팅됨. 환경별 활성화(provider=web-push)와 VAPID 키는
    # application-secret.yml의 해당 프로파일 문서에서 주입한다.
    provider: stub
    web-push:
      # subject는 비밀이 아니므로 공통 기본값으로 둔다 (public/private key만 secret에서 주입)
      subject: mailto:support@attune-me.com

