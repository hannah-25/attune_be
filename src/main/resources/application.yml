spring:
  application:
    name: attune

  profiles:
    default: local

  # application-secret.yml import
  config:
    import:
      - optional:classpath:application-secret.yml

  jpa:
    open-in-view: false # OSIV 비활성화 (성능/안정성 향상)
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true


# Springdoc OpenAPI (Swagger)
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    try-it-out-enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
    persist-authorization: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json



# Spring Boot Actuator ??
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
      base-path: /actuator
  metrics:
    export:
      simple:
        enabled: true
    tags:
      application: ${spring.application.name}
      release: ${APP_RELEASE:unknown}
      environment: local
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true            # /actuator/health/{liveness,readiness} 노출
      group:
        # readiness: 트래픽 수신 준비 — DB 장애를 실패로 반영 (배포 게이트가 이 신호를 사용)
        readiness:
          include: readinessState, db
        # liveness: JVM 생존만 검사(기본값 livenessState). 외부 의존성으로 불필요한 재시작 방지
  health:
    db:
      enabled: true              # DB 다운을 health/readiness 실패로 반영
    diskspace:
      enabled: true              # 디스크 부족 감지




# 앱 공통 설정


# Logging 설정
sentry:
  enabled: ${SENTRY_ENABLED:false}
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${APP_RELEASE:unknown}
  send-default-pii: false
  max-request-body-size: none
  sample-rate: ${SENTRY_SAMPLE_RATE:1.0}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  profiles-sample-rate: ${SENTRY_PROFILES_SAMPLE_RATE:0.0}
  attach-stacktrace: true
  attach-threads: false
  logging:
    enabled: false
  in-app-includes:
    - attune

logging:
  pattern:
    console: '%d{HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-no-request-id}] %logger{36} - %msg%n'
  level:
    attune.calendar: DEBUG

notification:
  push:
    # 기본값 stub: 키가 없어도 부팅됨. 환경별 활성화(provider=web-push)와 VAPID 키는
    # application-secret.yml의 해당 프로파일 문서에서 주입한다.
    provider: stub
    web-push:
      # subject는 비밀이 아니므로 공통 기본값으로 둔다 (public/private key만 secret에서 주입)
      subject: mailto:support@attune-me.com

admin:
  audit:
    hmac-secret: ${ADMIN_AUDIT_HMAC_SECRET}

