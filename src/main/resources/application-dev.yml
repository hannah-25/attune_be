# Dev 환경 설정 (개발 서버용, MySQL 8.4.x)
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true


# 개발 서버 로깅 설정
logging:
  level:
    root: INFO
    attune: DEBUG # 내 코드: 디버그 로그
    org.springframework.web: INFO
    # Alarm schedulers run every minute, so enable SQL logs only when needed.
    org.hibernate.SQL: ${LOGGING_LEVEL_HIBERNATE_SQL:OFF}
    org.hibernate.orm.jdbc.bind: ${LOGGING_LEVEL_HIBERNATE_BIND:OFF}
    org.springframework.security: INFO


# 개발 서버 CORS
cors:
  allowed-origin-patterns:
    - "https://dev.attune-me.com"
    - "https://*.dev.attune-me.com"


app:
  frontend-url: "https://dev.attune-me.com"

management:
  server:
    # Docker host network 배포에서 EC2 내부 health gate만 접근한다.
    # public 앱 포트(8080)와 분리해 actuator 노출면을 줄인다.
    port: ${MANAGEMENT_SERVER_PORT:8081}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  metrics:
    tags:
      environment: dev
